name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Browser-using tests (packages/automation/tests/browser/) launch a real
        # Chromium via @vina/automation's launchSiteContext — needs the binary.
        # `--with-deps` adds Linux system libraries (libnss3, libxkbcommon, etc.)
        # via apt-get so the bundled Chromium can launch on ubuntu-latest.
        run: pnpm --filter @vina/automation exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint
