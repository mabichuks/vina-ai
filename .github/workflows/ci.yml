name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Browser-using tests (packages/automation/tests/browser/) launch a real
        # Chromium via @vina/automation's launchSiteContext — needs the binary.
        # `--with-deps` adds Linux system libraries (libnss3, libxkbcommon, etc.)
        # via apt-get so the bundled Chromium can launch on ubuntu-latest.
        run: pnpm --filter @vina/automation exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Test
        # --maxWorkers=2 bounds concurrent Chromium instances — browser-heavy
        # suites SIGABRT under memory pressure when every worker launches one.
        run: pnpm test -- --maxWorkers=2
        env:
          # The managed-CDP launcher spawns Chromium directly (ADR-022),
          # bypassing Playwright's launcher defaults. GitHub's Ubuntu images
          # restrict unprivileged user namespaces (AppArmor), which makes the
          # Chromium sandbox abort at startup — opt out in CI only; user
          # machines keep the sandbox.
          VINA_CHROMIUM_NO_SANDBOX: "1"

      - name: Lint
        run: pnpm lint
